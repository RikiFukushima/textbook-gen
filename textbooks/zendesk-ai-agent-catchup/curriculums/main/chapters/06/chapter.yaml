id: "06"
title: 提案力と受託の地雷回避
estimated_minutes: 20
learning_objectives:
  - ハルシネーション対策と回答の根拠提示(どのナレッジを参照したか)を説明できる
  - 評価データセットの作り方と段階リリース(シャドウ運用 / A-B)を説明できる
  - 「自動送信」より「ドラフト提案」から入る安全設計の理由を説明できる
  - DoD(完了定義)を契約前に握る重要性と、コアの共通基盤化・顧客差分の外出しを説明できる
